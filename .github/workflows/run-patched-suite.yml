name: Run Patched Test Suite

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'PokeRogue branch to build from'
        required: false
        type: string
        default: 'main'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        platform: [all, mobile, android]
        shard: [1, 2, 3, 4, 5]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Clone PokeRogue fork
        run: git clone --recurse-submodules --depth 1 --branch ${{ inputs.branch || 'main' }} https://github.com/pagefaultgames/pokerogue.git pokerogue-src

      - name: Apply patches
        run: bash ${{ github.workspace }}/scripts/apply-patches.sh ${{ matrix.platform }}

      - name: Install PokeRogue dependencies
        working-directory: pokerogue-src
        run: pnpm install

      - name: Install Capacitor plugin stub for shared code resolution
        working-directory: pokerogue-src
        # google-drive-backup.ts and dropbox-backup.ts each dynamically import
        # native-only Capacitor plugins (@capgo/capacitor-social-login,
        # @capacitor/browser, @capacitor/app), gated behind an isCapacitor()
        # runtime check that's always false outside a real Capacitor build —
        # but Vitest's own Vite-based module resolution still needs each
        # package resolvable to collect the test files that reference them,
        # even though the code path never actually runs here. Without this,
        # test collection fails with an unresolved-import error. Same four
        # packages/versions used by build-android.yml and build-ios.yml.
        run: pnpm add @capacitor/core@8.4.1 @capacitor/app@8.1.1 @capacitor/browser@8.0.4 @capgo/capacitor-social-login@8.3.33

      - name: Run unit test suite (shard ${{ matrix.shard }}/5)
        working-directory: pokerogue-src
        run: pnpm test:silent --shard=${{ matrix.shard }}/5
