name: Build PokeRogueOffline macOS DMG

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number (leave blank to use this workflow run number)'
        required: false
        type: string
      dev:
        description: 'Dev build (banner marker + -dev naming)'
        required: false
        type: boolean
        default: false
      branch:
        description: 'PokeRogue branch to build from'
        required: false
        type: string
        default: 'main'
      version_override:
        description: 'Override the app version baked into this build (e.g. 1.12.0.0). Lets the installed app report an older version than pagefaultgames/pokerogue currently declares, for testing the update-checker against real existing releases. Leave blank to use whatever upstream currently has.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    strategy:
      matrix:
        arch: [x64, arm64]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Configure pnpm to avoid macOS hardlink EINVAL flake
        run: pnpm config set package-import-method copy

      - name: Clone PokeRogue fork
        run: git clone --recurse-submodules --depth 1 --branch ${{ inputs.branch || 'main' }} https://github.com/pagefaultgames/pokerogue.git pokerogue-src

      - name: Get PokeRogue version
        id: pokerogue_version
        uses: ./.github/actions/get-pokerogue-version
        with:
          version-override: ${{ inputs.version_override }}

      - name: Apply patches
        run: bash ${{ github.workspace }}/scripts/apply-patches.sh macos

      - name: Inject build number into banner
        uses: ./.github/actions/inject-build-number-banner
        with:
          build-number: ${{ inputs.build_number || github.run_number }}
          dev: ${{ inputs.dev }}

      - name: Install PokeRogue dependencies
        working-directory: pokerogue-src
        run: pnpm install

      - name: Install Electron dependencies
        working-directory: pokerogue-src
        run: pnpm add -D electron@43.0.0 electron-builder@26.15.3

      - name: Install Discord Rich Presence dependency
        working-directory: pokerogue-src
        # Not a devDependency - discord-rpc.cjs requires() this at runtime
        # in the packaged app, so it needs to actually ship in node_modules.
        run: pnpm add @xhayper/discord-rpc@1.5.1

      - name: Install Capacitor plugin stub for shared code resolution
        working-directory: pokerogue-src
        # google-drive-backup.ts dynamically imports @capgo/capacitor-social-login,
        # gated behind an isCapacitor() runtime check that's always false on
        # Electron — but Vite/Rolldown still needs the package resolvable at
        # BUILD time to code-split it, even though the chunk never actually
        # loads here. Without this, the build fails with an unresolved-import
        # error even on a platform that will never execute that branch.
        run: pnpm add @capacitor/core@8.4.1 @capgo/capacitor-social-login@8.3.33

      - name: Inject Scooom dev-build flag
        uses: ./.github/actions/inject-scooom-dev-flag
        with:
          dev: ${{ inputs.dev }}

      - name: Build PokeRogue
        working-directory: pokerogue-src
        env:
          VITE_BYPASS_LOGIN: '1'
        run: pnpm build --mode app

      - name: Apply post-build patches
        run: bash ${{ github.workspace }}/scripts/apply-post-build-patches.sh macos

      - name: Convert app icon to ICNS
        run: |
          ICONSET="${{ github.workspace }}/appIcon.iconset"
          mkdir -p "$ICONSET"
          SRC="${{ github.workspace }}/docs/appIcon.png"

          sips -z 16 16     "$SRC" --out "$ICONSET/icon_16x16.png"
          sips -z 32 32     "$SRC" --out "$ICONSET/icon_16x16@2x.png"
          sips -z 32 32     "$SRC" --out "$ICONSET/icon_32x32.png"
          sips -z 64 64     "$SRC" --out "$ICONSET/icon_32x32@2x.png"
          sips -z 128 128   "$SRC" --out "$ICONSET/icon_128x128.png"
          sips -z 256 256   "$SRC" --out "$ICONSET/icon_128x128@2x.png"
          sips -z 256 256   "$SRC" --out "$ICONSET/icon_256x256.png"
          sips -z 512 512   "$SRC" --out "$ICONSET/icon_256x256@2x.png"
          sips -z 512 512   "$SRC" --out "$ICONSET/icon_512x512.png"
          sips -z 1024 1024 "$SRC" --out "$ICONSET/icon_512x512@2x.png"

          iconutil -c icns "$ICONSET" -o "${{ github.workspace }}/docs/appIcon.icns"
          echo "ICNS created at ${{ github.workspace }}/docs/appIcon.icns"

      - name: Copy Electron config files into place
        run: |
          cp ${{ github.workspace }}/configs/desktop/electron/main.cjs pokerogue-src/main.cjs
          cp ${{ github.workspace }}/configs/desktop/electron/preload.cjs pokerogue-src/preload.cjs
          cp ${{ github.workspace }}/configs/desktop/electron/updater.cjs pokerogue-src/updater.cjs
          cp ${{ github.workspace }}/configs/desktop/electron/discord-rpc.cjs pokerogue-src/discord-rpc.cjs
          cp ${{ github.workspace }}/configs/desktop/electron/electron-builder.macos.json pokerogue-src/electron-builder.json
          cp ${{ github.workspace }}/docs/appIcon.icns pokerogue-src/appIcon.icns

      - name: Inject build number into updater.cjs
        uses: ./.github/actions/inject-build-number-banner
        with:
          build-number: ${{ inputs.build_number || github.run_number }}
          dev: ${{ inputs.dev }}
          target-file: pokerogue-src/updater.cjs

      - name: Inject Discord client ID into discord-rpc.cjs
        uses: ./.github/actions/inject-discord-client-id
        with:
          target-file: pokerogue-src/discord-rpc.cjs
          discord-client-id: ${{ secrets.DISCORD_CLIENT_ID }}

      - name: Inject Google OAuth credentials into main.cjs
        uses: ./.github/actions/inject-google-desktop-oauth
        with:
          client-id: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          client-secret: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}

      - name: Inject Dropbox App Key
        uses: ./.github/actions/inject-dropbox-app-key
        with:
          target-file: pokerogue-src/main.cjs
          dropbox-app-key: ${{ inputs.dev == 'true' && secrets.DROPBOX_APP_KEY_DEV || secrets.DROPBOX_APP_KEY }}

      - name: Set electron main in package.json
        uses: ./.github/actions/set-electron-package-metadata

      - name: Get 3 Num Version
        id: old_ver
        uses: ./.github/actions/get-electron-package-version

      - name: Generate macOS DMG + app bundle tar.gz
        working-directory: pokerogue-src
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        # tar.gz is a second target alongside dmg, built in the same pass -
        # it ships the raw .app bundle (no mounting), which is what the
        # in-Electron self-updater downloads and swaps in directly (see
        # configs/desktop/electron/updater.cjs); the dmg stays the normal
        # first-install download.
        run: pnpm electron-builder --mac dmg --mac tar.gz --${{ matrix.arch }} --publish never --config electron-builder.json --config.extraMetadata.version=${{ steps.old_ver.outputs.version }}

      - name: Rename and save DMG
        id: dmg_path
        run: |
          FILE=$(find . -type f -name "*.dmg" | head -n1)
          if [ "${{ inputs.dev }}" = "true" ]; then
            OUTPUT="./PokeRogueOffline-dev-${{ matrix.arch }}.dmg"
          else
            OUTPUT="./PokeRogueOffline-${{ matrix.arch }}.dmg"
          fi
          mv "$FILE" "$OUTPUT"
          echo "dmg=$OUTPUT" >> $GITHUB_OUTPUT

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokeRogueOffline-macOS-${{ matrix.arch }}${{ inputs.dev && '-dev' || '' }}
          path: ${{ steps.dmg_path.outputs.dmg }}
          retention-days: 30

      - name: Rename and save app bundle tar.gz
        id: tarball_path
        run: |
          FILE=$(find . -type f -name "*.tar.gz" | head -n1)
          if [ "${{ inputs.dev }}" = "true" ]; then
            OUTPUT="./PokeRogueOffline-dev-${{ matrix.arch }}.app.tar.gz"
          else
            OUTPUT="./PokeRogueOffline-${{ matrix.arch }}.app.tar.gz"
          fi
          mv "$FILE" "$OUTPUT"
          echo "tarball=$OUTPUT" >> $GITHUB_OUTPUT

      - name: Upload app bundle tar.gz artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokeRogueOffline-macOS-${{ matrix.arch }}-app${{ inputs.dev && '-dev' || '' }}
          path: ${{ steps.tarball_path.outputs.tarball }}
          retention-days: 30
