name: Create Release

on:
  workflow_dispatch:
    inputs:
      dev:
        description: 'Dev run: build all platforms and attach outputs as artifacts on this run instead of publishing a GitHub release'
        required: false
        type: boolean
        default: false
      branch:
        description: 'PokeRogue branch to build from'
        required: false
        type: string
        default: 'main'
      # Forwarded to all five build workflows so every platform bakes in and
      # reports the SAME version - each platform clones its own pokerogue-src
      # and compiles its own package.json version into its own bundle, so
      # overriding only one platform would make its title-screen version text
      # (and in-app update-checker) disagree with the others for one release.
      # Leave blank for normal behavior (each platform uses upstream's actual
      # version, as usual). Only set this to force the update-checker to fire
      # on a release that doesn't bump the (upstream-owned) app version - e.g.
      # a fork-only hotfix - pick something below the next real upstream bump.
      version_override:
        description: 'Fake app version for every platform in this release (e.g. 1.12.0.25). Leave blank for normal behavior.'
        required: false
        type: string
      skip_altstore:
        description: 'Skip updating the AltStore source (seed branch repo.json). The GitHub release is still published and will still be picked up by the in-app updater for all users - this only keeps it out of the AltStore feed.'
        required: false
        type: boolean
        default: false
      notify:
        description: 'Send an ntfy notification when this run finishes. Disabled by nightly-builds.yml, which sends its own notification (only on failure) instead.'
        required: false
        type: boolean
        default: true

permissions:
  actions: write   # needed to trigger and query other workflow runs
  contents: write  # needed to create the GitHub release

jobs:
  release:
    outputs:
      version: ${{ steps.version.outputs.version }} # This exposes the data
      is_release: ${{ steps.gate.outputs.is_release }}
      is_dev_release: ${{ steps.gate.outputs.is_dev_release }}
      build_number: ${{ steps.build.outputs.number }}
      ipa_size: ${{ steps.ipa_size.outputs.size }}
    # Job-level permissions override the workflow-level block entirely, so
    # this repeats actions/contents from above and adds what attest-build-
    # provenance needs (id-token to mint the signing identity, attestations
    # to publish the result) - scoped to this job only, since no other job
    # in this workflow produces anything worth attesting.
    permissions:
      actions: write
      contents: write
      attestations: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Record a timestamp just before triggering each build, then locate the
      # resulting run ID by finding the first run created after that moment.
      # This avoids any dependency on workflow inputs being queryable via API.
      # -----------------------------------------------------------------------
      - name: Compute build number
        id: build
        run: echo "number=$(( ${{ github.run_number }} + 100 ))" >> $GITHUB_OUTPUT

      - name: Trigger iOS build
        id: trigger_ios
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run build-ios.yml --ref "${{ github.ref_name }}" \
            -f build_number=${{ steps.build.outputs.number }} \
            -f dev=${{ inputs.dev }} \
            -f branch=${{ inputs.branch || 'main' }} \
            -f version_override=${{ inputs.version_override }}
          echo "triggered_after=$TS" >> $GITHUB_OUTPUT

      - name: Trigger Android build
        id: trigger_android
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run build-android.yml --ref "${{ github.ref_name }}" \
            -f build_number=${{ steps.build.outputs.number }} \
            -f dev=${{ inputs.dev }} \
            -f branch=${{ inputs.branch || 'main' }} \
            -f version_override=${{ inputs.version_override }}
          echo "triggered_after=$TS" >> $GITHUB_OUTPUT

      - name: Trigger AppImage build
        id: trigger_appimage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run build-appimage.yml --ref "${{ github.ref_name }}" \
            -f build_number=${{ steps.build.outputs.number }} \
            -f dev=${{ inputs.dev }} \
            -f branch=${{ inputs.branch || 'main' }} \
            -f version_override=${{ inputs.version_override }}
          echo "triggered_after=$TS" >> $GITHUB_OUTPUT

      - name: Trigger Windows build
        id: trigger_windows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run build-exe.yml --ref "${{ github.ref_name }}" \
            -f build_number=${{ steps.build.outputs.number }} \
            -f dev=${{ inputs.dev }} \
            -f branch=${{ inputs.branch || 'main' }} \
            -f version_override=${{ inputs.version_override }}
          echo "triggered_after=$TS" >> $GITHUB_OUTPUT

      - name: Trigger macOS build
        id: trigger_macos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run build-macos.yml --ref "${{ github.ref_name }}" \
            -f build_number=${{ steps.build.outputs.number }} \
            -f dev=${{ inputs.dev }} \
            -f branch=${{ inputs.branch || 'main' }} \
            -f version_override=${{ inputs.version_override }}
          echo "triggered_after=$TS" >> $GITHUB_OUTPUT


      # -----------------------------------------------------------------------
      # Locate the run IDs by polling for runs created after the trigger
      # timestamps. Retry for up to 2 minutes to allow GitHub to register them.
      # Run ID is written to a temp file to avoid capturing log lines in $().
      # -----------------------------------------------------------------------
      - name: Locate run IDs
        id: runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          IOS_AFTER: ${{ steps.trigger_ios.outputs.triggered_after }}
          ANDROID_AFTER: ${{ steps.trigger_android.outputs.triggered_after }}
          APPIMAGE_AFTER: ${{ steps.trigger_appimage.outputs.triggered_after }}
          WINDOWS_AFTER: ${{ steps.trigger_windows.outputs.triggered_after }}
          MACOS_AFTER: ${{ steps.trigger_macos.outputs.triggered_after }}
        run: |
          set -e

          locate_run() {
            local workflow="$1"
            local after="$2"
            local label="$3"
            local outfile="$4"

            for i in $(seq 1 24); do
              RUN_ID=$(gh api \
                "repos/$REPO/actions/workflows/${workflow}/runs?per_page=5&created=>=${after}" \
                --jq '.workflow_runs | sort_by(.created_at) | .[0].id // empty')
              if [ -n "$RUN_ID" ]; then
                echo "Found $label run: $RUN_ID"
                echo "$RUN_ID" > "$outfile"
                return 0
              fi
              echo "Waiting for $label run to appear... (attempt $i/24)"
              sleep 5
            done

            echo "ERROR: Timed out locating $label run ID."
            return 1
          }

          locate_run "build-ios.yml" "$IOS_AFTER" "iOS" /tmp/ios_run_id
          locate_run "build-android.yml" "$ANDROID_AFTER" "Android" /tmp/android_run_id
          locate_run "build-appimage.yml" "$APPIMAGE_AFTER" "AppImage" /tmp/appimage_run_id
          locate_run "build-exe.yml" "$WINDOWS_AFTER" "Windows" /tmp/windows_run_id
          locate_run "build-macos.yml" "$MACOS_AFTER" "macOS" /tmp/macos_run_id


          IOS_RUN_ID=$(cat /tmp/ios_run_id)
          ANDROID_RUN_ID=$(cat /tmp/android_run_id)
          APPIMAGE_RUN_ID=$(cat /tmp/appimage_run_id)
          WINDOWS_RUN_ID=$(cat /tmp/windows_run_id)
          MACOS_RUN_ID=$(cat /tmp/macos_run_id)


          echo "ios_run_id=$IOS_RUN_ID" >> $GITHUB_OUTPUT
          echo "android_run_id=$ANDROID_RUN_ID" >> $GITHUB_OUTPUT
          echo "appimage_run_id=$APPIMAGE_RUN_ID" >> $GITHUB_OUTPUT
          echo "windows_run_id=$WINDOWS_RUN_ID" >> $GITHUB_OUTPUT
          echo "macos_run_id=$MACOS_RUN_ID" >> $GITHUB_OUTPUT


      # -----------------------------------------------------------------------
      # Poll until all runs reach a terminal state.
      # Timeout after 90 minutes (iOS builds on macos-latest can be slow).
      # If one build fails, the other is cancelled immediately.
      # -----------------------------------------------------------------------
      - name: Wait for builds to complete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          IOS_RUN_ID: ${{ steps.runs.outputs.ios_run_id }}
          ANDROID_RUN_ID: ${{ steps.runs.outputs.android_run_id }}
          APPIMAGE_RUN_ID: ${{ steps.runs.outputs.appimage_run_id }}
          WINDOWS_RUN_ID: ${{ steps.runs.outputs.windows_run_id }}
          MACOS_RUN_ID: ${{ steps.runs.outputs.macos_run_id }}

        run: |
          set -e

          TIMEOUT=5400  # 90 minutes
          POLL=30
          ELAPSED=0

          cancel_run() {
            local run_id="$1"
            local label="$2"
            local status="$3"
            if [ "$status" != "completed" ]; then
              echo "Cancelling $label run $run_id..."
              gh api --method POST "repos/$REPO/actions/runs/$run_id/cancel" || true
            fi
          }

          while true; do
            IOS_STATUS=$(gh api "repos/$REPO/actions/runs/$IOS_RUN_ID" --jq '.status')
            IOS_CONCLUSION=$(gh api "repos/$REPO/actions/runs/$IOS_RUN_ID" --jq '.conclusion')
            ANDROID_STATUS=$(gh api "repos/$REPO/actions/runs/$ANDROID_RUN_ID" --jq '.status')
            ANDROID_CONCLUSION=$(gh api "repos/$REPO/actions/runs/$ANDROID_RUN_ID" --jq '.conclusion')
            APPIMAGE_STATUS=$(gh api "repos/$REPO/actions/runs/$APPIMAGE_RUN_ID" --jq '.status')
            APPIMAGE_CONCLUSION=$(gh api "repos/$REPO/actions/runs/$APPIMAGE_RUN_ID" --jq '.conclusion')

            WINDOWS_STATUS=$(gh api "repos/$REPO/actions/runs/$WINDOWS_RUN_ID" --jq '.status')
            WINDOWS_CONCLUSION=$(gh api "repos/$REPO/actions/runs/$WINDOWS_RUN_ID" --jq '.conclusion')
            MACOS_STATUS=$(gh api "repos/$REPO/actions/runs/$MACOS_RUN_ID" --jq '.status')
            MACOS_CONCLUSION=$(gh api "repos/$REPO/actions/runs/$MACOS_RUN_ID" --jq '.conclusion')

            echo -e "iOS: $IOS_STATUS / $IOS_CONCLUSION | Android: $ANDROID_STATUS / $ANDROID_CONCLUSION | AppImage: $APPIMAGE_STATUS / $APPIMAGE_CONCLUSION | Windows: $WINDOWS_STATUS / $WINDOWS_CONCLUSION | macOS: $MACOS_STATUS / $MACOS_CONCLUSION | (${ELAPSED}s elapsed)"

            # If one has failed, cancel the others and exit immediately
            if [ "$IOS_STATUS" = "completed" ] && [ "$IOS_CONCLUSION" != "success" ]; then
              cancel_run "$ANDROID_RUN_ID" "Android" "$ANDROID_STATUS"
              cancel_run "$WINDOWS_RUN_ID" "Windows" "$WINDOWS_STATUS"
              cancel_run "$APPIMAGE_RUN_ID" "AppImage" "$APPIMAGE_STATUS"
              cancel_run "$MACOS_RUN_ID" "macOS" "$MACOS_STATUS"
              echo "ERROR: iOS build ended with: $IOS_CONCLUSION"
              exit 1
            fi
            if [ "$ANDROID_STATUS" = "completed" ] && [ "$ANDROID_CONCLUSION" != "success" ]; then
              cancel_run "$IOS_RUN_ID" "iOS" "$IOS_STATUS"
              cancel_run "$APPIMAGE_RUN_ID" "AppImage" "$APPIMAGE_STATUS"
              cancel_run "$WINDOWS_RUN_ID" "Windows" "$WINDOWS_STATUS"
              cancel_run "$MACOS_RUN_ID" "macOS" "$MACOS_STATUS"
              echo "ERROR: Android build ended with: $ANDROID_CONCLUSION"
              exit 1
            fi
            
            if [ "$APPIMAGE_STATUS" = "completed" ] && [ "$APPIMAGE_CONCLUSION" != "success" ]; then
              cancel_run "$IOS_RUN_ID" "iOS" "$IOS_STATUS"
              cancel_run "$ANDROID_RUN_ID" "Android" "$ANDROID_STATUS"
              cancel_run "$WINDOWS_RUN_ID" "Windows" "$WINDOWS_STATUS"
              cancel_run "$MACOS_RUN_ID" "macOS" "$MACOS_STATUS"
              echo "ERROR: AppImage build ended with: $APPIMAGE_CONCLUSION"
              exit 1
            fi

            if [ "$WINDOWS_STATUS" = "completed" ] && [ "$WINDOWS_CONCLUSION" != "success" ]; then
              cancel_run "$IOS_RUN_ID" "iOS" "$IOS_STATUS"
              cancel_run "$ANDROID_RUN_ID" "Android" "$ANDROID_STATUS"
              cancel_run "$APPIMAGE_RUN_ID" "AppImage" "$APPIMAGE_STATUS"
              cancel_run "$MACOS_RUN_ID" "macOS" "$MACOS_STATUS"
              echo "ERROR: Windows build ended with: $WINDOWS_CONCLUSION"
              exit 1
            fi

            if [ "$MACOS_STATUS" = "completed" ] && [ "$MACOS_CONCLUSION" != "success" ]; then
              cancel_run "$IOS_RUN_ID" "iOS" "$IOS_STATUS"
              cancel_run "$ANDROID_RUN_ID" "Android" "$ANDROID_STATUS"
              cancel_run "$APPIMAGE_RUN_ID" "AppImage" "$APPIMAGE_STATUS"
              cancel_run "$WINDOWS_RUN_ID" "Windows" "$WINDOWS_STATUS"
              echo "ERROR: macOS build ended with: $MACOS_CONCLUSION"
              exit 1
            fi

            if [ "$IOS_STATUS" = "completed" ] && [ "$ANDROID_STATUS" = "completed" ] && [ "$APPIMAGE_STATUS" = "completed" ] && [ "$WINDOWS_STATUS" = "completed" ] && [ "$MACOS_STATUS" = "completed" ]; then
              echo "All builds succeeded."
              break
            fi

            ELAPSED=$((ELAPSED + POLL))
            if [ $ELAPSED -ge $TIMEOUT ]; then
              cancel_run "$IOS_RUN_ID" "iOS" "$IOS_STATUS"
              cancel_run "$ANDROID_RUN_ID" "Android" "$ANDROID_STATUS"
              cancel_run "$APPIMAGE_RUN_ID" "AppImage" "$APPIMAGE_STATUS"
              cancel_run "$WINDOWS_RUN_ID" "Windows" "$WINDOWS_STATUS"
              cancel_run "$MACOS_RUN_ID" "macOS" "$MACOS_STATUS"
              echo "ERROR: Timed out waiting for builds to complete."
              exit 1
            fi
            sleep $POLL
          done

      # -----------------------------------------------------------------------
      # Download all artifacts into the workspace. Artifact names and the
      # filenames inside them carry a "-dev" suffix when inputs.dev is true.
      # -----------------------------------------------------------------------
      - name: Determine release eligibility
        id: gate
        run: |
          if [ "${{ inputs.dev }}" != "true" ] && { [ "${{ inputs.branch }}" = "main" ] || [ -z "${{ inputs.branch }}" ]; }; then
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi

          # Dev test releases: published whenever dev=true, regardless of branch - this is
          # the maintainer's existing manual-dispatch test workflow (any branch + a custom
          # version_override), just now also publishing something a dev-flagged build's
          # in-app updater can discover. Tag is dev-v{version}-{buildNumber} ("dev-" prefix)
          # so it never matches update-check-api.ts's/updater.cjs's/mobile-updater.ts's
          # anchored "^v..." tag regexes - real builds stay structurally blind to these
          # with no code change on their side. Title carries a "***DEV***" marker for
          # browsing the Releases page by eye only; nothing parses it.
          if [ "${{ inputs.dev }}" = "true" ]; then
            echo "is_dev_release=true" >> $GITHUB_OUTPUT
          else
            echo "is_dev_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Set naming suffix
        id: suffix
        run: |
          if [ "${{ inputs.dev }}" = "true" ]; then
            echo "tag=-dev" >> $GITHUB_OUTPUT
          else
            echo "tag=" >> $GITHUB_OUTPUT
          fi

      - name: Download IPA artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          IOS_RUN_ID: ${{ steps.runs.outputs.ios_run_id }}
          TAG: ${{ steps.suffix.outputs.tag }}
        run: |
          ARTIFACT_ID=$(gh api "repos/$REPO/actions/runs/$IOS_RUN_ID/artifacts" \
            --jq ".artifacts[] | select(.name == \"PokeRogueOffline-iOS${TAG}\") | .id")
          gh api "repos/$REPO/actions/artifacts/$ARTIFACT_ID/zip" > ipa.zip
          unzip ipa.zip -d ipa-out
          mv "ipa-out/PokeRogueOffline${TAG}.ipa" "./PokeRogueOffline${TAG}.ipa"
          mv "ipa-out/ota-code.zip" "./PokeRogueOffline-iOS-ota-code.zip"
          mv "ipa-out/ota-assets.zip" "./PokeRogueOffline-iOS-ota-assets.zip"
          mv "ipa-out/ota-locales.zip" "./PokeRogueOffline-iOS-ota-locales.zip"
          mv "ipa-out/ota-manifest-ios.json" "./PokeRogueOffline-iOS-ota-manifest.json"

      - name: Download APK artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ANDROID_RUN_ID: ${{ steps.runs.outputs.android_run_id }}
          TAG: ${{ steps.suffix.outputs.tag }}
        run: |
          ARTIFACT_ID=$(gh api "repos/$REPO/actions/runs/$ANDROID_RUN_ID/artifacts" \
            --jq ".artifacts[] | select(.name == \"PokeRogueOffline-Android${TAG}\") | .id")
          gh api "repos/$REPO/actions/artifacts/$ARTIFACT_ID/zip" > apk.zip
          unzip apk.zip -d apk-out
          mv "apk-out/PokeRogueOffline${TAG}.apk" "./PokeRogueOffline${TAG}.apk"
          mv "apk-out/ota-code.zip" "./PokeRogueOffline-Android-ota-code.zip"
          mv "apk-out/ota-assets.zip" "./PokeRogueOffline-Android-ota-assets.zip"
          mv "apk-out/ota-locales.zip" "./PokeRogueOffline-Android-ota-locales.zip"
          mv "apk-out/ota-manifest-android.json" "./PokeRogueOffline-Android-ota-manifest.json"
          
      - name: Download AppImage artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          APPIMAGE_RUN_ID: ${{ steps.runs.outputs.appimage_run_id }}
          TAG: ${{ steps.suffix.outputs.tag }}
        run: |
          ARTIFACT_ID=$(gh api "repos/$REPO/actions/runs/$APPIMAGE_RUN_ID/artifacts" \
            --jq ".artifacts[] | select(.name == \"PokeRogueOffline-AppImage${TAG}\") | .id")
          gh api "repos/$REPO/actions/artifacts/$ARTIFACT_ID/zip" > appimage.zip
          unzip appimage.zip -d appimage-out
          mv "appimage-out/PokeRogueOffline${TAG}.AppImage" "./PokeRogueOffline${TAG}.AppImage"
          
      - name: Download Windows EXE artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          WINDOWS_RUN_ID: ${{ steps.runs.outputs.windows_run_id }}
          TAG: ${{ steps.suffix.outputs.tag }}
        run: |
          ARTIFACT_ID=$(gh api "repos/$REPO/actions/runs/$WINDOWS_RUN_ID/artifacts" \
            --jq ".artifacts[] | select(.name == \"PokeRogueOffline-Windows${TAG}\") | .id")
          gh api "repos/$REPO/actions/artifacts/$ARTIFACT_ID/zip" > windows.zip
          unzip windows.zip -d windows-out
          mv "windows-out/PokeRogueOffline${TAG}.exe" "./PokeRogueOffline${TAG}.exe"

      - name: Download macOS x64 DMG artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          MACOS_RUN_ID: ${{ steps.runs.outputs.macos_run_id }}
          TAG: ${{ steps.suffix.outputs.tag }}
        run: |
          ARTIFACT_ID=$(gh api "repos/$REPO/actions/runs/$MACOS_RUN_ID/artifacts" \
            --jq ".artifacts[] | select(.name == \"PokeRogueOffline-macOS-x64${TAG}\") | .id")
          gh api "repos/$REPO/actions/artifacts/$ARTIFACT_ID/zip" > macos-x64.zip
          unzip macos-x64.zip -d macos-x64-out
          mv "macos-x64-out/PokeRogueOffline${TAG}-x64.dmg" "./PokeRogueOffline${TAG}-x64.dmg"

      - name: Download macOS arm64 DMG artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          MACOS_RUN_ID: ${{ steps.runs.outputs.macos_run_id }}
          TAG: ${{ steps.suffix.outputs.tag }}
        run: |
          ARTIFACT_ID=$(gh api "repos/$REPO/actions/runs/$MACOS_RUN_ID/artifacts" \
            --jq ".artifacts[] | select(.name == \"PokeRogueOffline-macOS-arm64${TAG}\") | .id")
          gh api "repos/$REPO/actions/artifacts/$ARTIFACT_ID/zip" > macos-arm64.zip
          unzip macos-arm64.zip -d macos-arm64-out
          mv "macos-arm64-out/PokeRogueOffline${TAG}-arm64.dmg" "./PokeRogueOffline${TAG}-arm64.dmg"

      # macOS .app bundle tar.gz assets - separate from the DMGs above, used
      # only by the in-Electron self-updater (it swaps the raw bundle in
      # directly rather than mounting a disk image).
      - name: Download macOS x64 app bundle tar.gz artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          MACOS_RUN_ID: ${{ steps.runs.outputs.macos_run_id }}
          TAG: ${{ steps.suffix.outputs.tag }}
        run: |
          ARTIFACT_ID=$(gh api "repos/$REPO/actions/runs/$MACOS_RUN_ID/artifacts" \
            --jq ".artifacts[] | select(.name == \"PokeRogueOffline-macOS-x64-app${TAG}\") | .id")
          gh api "repos/$REPO/actions/artifacts/$ARTIFACT_ID/zip" > macos-x64-app.zip
          unzip macos-x64-app.zip -d macos-x64-app-out
          mv "macos-x64-app-out/PokeRogueOffline${TAG}-x64.app.tar.gz" "./PokeRogueOffline${TAG}-x64.app.tar.gz"

      - name: Download macOS arm64 app bundle tar.gz artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          MACOS_RUN_ID: ${{ steps.runs.outputs.macos_run_id }}
          TAG: ${{ steps.suffix.outputs.tag }}
        run: |
          ARTIFACT_ID=$(gh api "repos/$REPO/actions/runs/$MACOS_RUN_ID/artifacts" \
            --jq ".artifacts[] | select(.name == \"PokeRogueOffline-macOS-arm64-app${TAG}\") | .id")
          gh api "repos/$REPO/actions/artifacts/$ARTIFACT_ID/zip" > macos-arm64-app.zip
          unzip macos-arm64-app.zip -d macos-arm64-app-out
          mv "macos-arm64-app-out/PokeRogueOffline${TAG}-arm64.app.tar.gz" "./PokeRogueOffline${TAG}-arm64.app.tar.gz"


      # -----------------------------------------------------------------------
      # Read the version string from version.txt bundled in the iOS artifact.
      # This guarantees the tag matches what's actually in the binaries, rather
      # than fetching live from upstream which could have changed since the build ran.
      # -----------------------------------------------------------------------
      - name: Read version
        id: version
        run: |
          VERSION=$(cat ipa-out/version.txt)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Found Version: ${VERSION}"

      - name: Compute release tag/title
        id: release_meta
        run: |
          if [ "${{ steps.gate.outputs.is_dev_release }}" = "true" ]; then
            echo "tag_name=dev-v${{ steps.version.outputs.version }}-${{ steps.build.outputs.number }}" >> $GITHUB_OUTPUT
            echo "name=***DEV*** v${{ steps.version.outputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag_name=v${{ steps.version.outputs.version }}-${{ steps.build.outputs.number }}" >> $GITHUB_OUTPUT
            echo "name=v${{ steps.version.outputs.version }}" >> $GITHUB_OUTPUT
          fi

      # -----------------------------------------------------------------------
      # Non-release run (dev=true, or dev=false on a non-main branch): skip
      # the GitHub release and AltStore feed update. Each platform's output
      # is uploaded as its own artifact (not bundled) so downloading e.g.
      # just the iOS build doesn't pull the others along.
      # -----------------------------------------------------------------------
      - name: Upload iOS artifact
        if: ${{ steps.gate.outputs.is_release != 'true' && steps.gate.outputs.is_dev_release != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: PokeRogueOffline-iOS-v${{ steps.version.outputs.version }}-${{ steps.build.outputs.number }}
          path: PokeRogueOffline${{ steps.suffix.outputs.tag }}.ipa
          retention-days: 30

      - name: Upload Android artifact
        if: ${{ steps.gate.outputs.is_release != 'true' && steps.gate.outputs.is_dev_release != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: PokeRogueOffline-Android-v${{ steps.version.outputs.version }}-${{ steps.build.outputs.number }}
          path: PokeRogueOffline${{ steps.suffix.outputs.tag }}.apk
          retention-days: 30

      - name: Upload AppImage artifact
        if: ${{ steps.gate.outputs.is_release != 'true' && steps.gate.outputs.is_dev_release != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: PokeRogueOffline-AppImage-v${{ steps.version.outputs.version }}-${{ steps.build.outputs.number }}
          path: PokeRogueOffline${{ steps.suffix.outputs.tag }}.AppImage
          retention-days: 30

      - name: Upload Windows artifact
        if: ${{ steps.gate.outputs.is_release != 'true' && steps.gate.outputs.is_dev_release != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: PokeRogueOffline-Windows-v${{ steps.version.outputs.version }}-${{ steps.build.outputs.number }}
          path: PokeRogueOffline${{ steps.suffix.outputs.tag }}.exe
          retention-days: 30

      - name: Upload macOS x64 artifact
        if: ${{ steps.gate.outputs.is_release != 'true' && steps.gate.outputs.is_dev_release != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: PokeRogueOffline-macOS-x64-v${{ steps.version.outputs.version }}-${{ steps.build.outputs.number }}
          path: PokeRogueOffline${{ steps.suffix.outputs.tag }}-x64.dmg
          retention-days: 30

      - name: Upload macOS arm64 artifact
        if: ${{ steps.gate.outputs.is_release != 'true' && steps.gate.outputs.is_dev_release != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: PokeRogueOffline-macOS-arm64-v${{ steps.version.outputs.version }}-${{ steps.build.outputs.number }}
          path: PokeRogueOffline${{ steps.suffix.outputs.tag }}-arm64.dmg
          retention-days: 30

      - name: Upload macOS x64 app bundle artifact
        if: ${{ steps.gate.outputs.is_release != 'true' && steps.gate.outputs.is_dev_release != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: PokeRogueOffline-macOS-x64-app-v${{ steps.version.outputs.version }}-${{ steps.build.outputs.number }}
          path: PokeRogueOffline${{ steps.suffix.outputs.tag }}-x64.app.tar.gz
          retention-days: 30

      - name: Upload macOS arm64 app bundle artifact
        if: ${{ steps.gate.outputs.is_release != 'true' && steps.gate.outputs.is_dev_release != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: PokeRogueOffline-macOS-arm64-app-v${{ steps.version.outputs.version }}-${{ steps.build.outputs.number }}
          path: PokeRogueOffline${{ steps.suffix.outputs.tag }}-arm64.app.tar.gz
          retention-days: 30

      - name: Get IPA size
        if: ${{ steps.gate.outputs.is_release == 'true' }}
        id: ipa_size
        run: echo "size=$(wc -c < PokeRogueOffline.ipa)" >> $GITHUB_OUTPUT

      # -----------------------------------------------------------------------
      # Checksums for the six binaries, so a sideloader downloading an
      # unsigned binary over a flaky connection (or wanting to confirm it
      # wasn't tampered with in transit) has something to check it against.
      # -----------------------------------------------------------------------
      - name: Generate checksums
        if: ${{ steps.gate.outputs.is_release == 'true' || steps.gate.outputs.is_dev_release == 'true' }}
        env:
          TAG: ${{ steps.suffix.outputs.tag }}
        run: |
          sha256sum \
            "PokeRogueOffline${TAG}.ipa" \
            "PokeRogueOffline${TAG}.apk" \
            "PokeRogueOffline${TAG}.AppImage" \
            "PokeRogueOffline${TAG}.exe" \
            "PokeRogueOffline${TAG}-x64.dmg" \
            "PokeRogueOffline${TAG}-arm64.dmg" \
            "PokeRogueOffline${TAG}-x64.app.tar.gz" \
            "PokeRogueOffline${TAG}-arm64.app.tar.gz" \
            PokeRogueOffline-Android-ota-code.zip \
            PokeRogueOffline-Android-ota-assets.zip \
            PokeRogueOffline-Android-ota-locales.zip \
            PokeRogueOffline-iOS-ota-code.zip \
            PokeRogueOffline-iOS-ota-assets.zip \
            PokeRogueOffline-iOS-ota-locales.zip \
            > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # -----------------------------------------------------------------------
      # Publish the combined GitHub release: either a real release (dev=false
      # AND branch=main), or a dev test release (dev=true, any branch) - the
      # latter is a throwaway release used to let dev-flagged builds exercise
      # the in-app updater (see release_meta above for the tag/title scheme
      # that keeps these invisible to real builds) and is never promoted off
      # prerelease.
      # -----------------------------------------------------------------------
      - name: Create Release
        if: ${{ steps.gate.outputs.is_release == 'true' || steps.gate.outputs.is_dev_release == 'true' }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: ${{ steps.release_meta.outputs.name }}
          prerelease: true
          body: |
            ## PokeRogueOffline v${{ steps.version.outputs.version }}

            <!-- changelog:start -->
            <!-- changelog:end -->

            - **PokeRogueOffline.ipa** — iOS (sideload via SideStore / LiveContainer / Feather)
            - **PokeRogueOffline.apk** — Android (sideload by enabling "Install unknown apps")
            - **PokeRogueOffline.AppImage** — Linux AppImage
            - **PokeRogueOffline.exe** — Windows Portable EXE
            - **PokeRogueOffline-x64.dmg** — macOS (Intel)
            - **PokeRogueOffline-arm64.dmg** — macOS (Apple Silicon)
            - **PokeRogueOffline-x64.app.tar.gz** / **PokeRogueOffline-arm64.app.tar.gz** — macOS app bundle, used only by the in-app self-updater (not for manual install — use the DMG for that)
            - **PokeRogueOffline-{Android,iOS}-ota-{code,assets,locales}.zip** + their `-ota-manifest.json` — the mobile in-app updater's three independently-updatable channels (code/assets/locales), so a code-only update doesn't force re-downloading the (much larger) assets or locales bundles (not for manual install)
            - **SHA256SUMS.txt** — checksums for the fourteen files above (excluding the two `-ota-manifest.json` files, which carry their own per-channel checksums)
            - Build provenance for each binary is attested via GitHub Actions — verify with `gh attestation verify <file> --repo ${{ github.repository }}`

          files: |
            PokeRogueOffline${{ steps.suffix.outputs.tag }}.ipa
            PokeRogueOffline${{ steps.suffix.outputs.tag }}.apk
            PokeRogueOffline${{ steps.suffix.outputs.tag }}.AppImage
            PokeRogueOffline${{ steps.suffix.outputs.tag }}.exe
            PokeRogueOffline${{ steps.suffix.outputs.tag }}-x64.dmg
            PokeRogueOffline${{ steps.suffix.outputs.tag }}-arm64.dmg
            PokeRogueOffline${{ steps.suffix.outputs.tag }}-x64.app.tar.gz
            PokeRogueOffline${{ steps.suffix.outputs.tag }}-arm64.app.tar.gz
            PokeRogueOffline-Android-ota-code.zip
            PokeRogueOffline-Android-ota-assets.zip
            PokeRogueOffline-Android-ota-locales.zip
            PokeRogueOffline-Android-ota-manifest.json
            PokeRogueOffline-iOS-ota-code.zip
            PokeRogueOffline-iOS-ota-assets.zip
            PokeRogueOffline-iOS-ota-locales.zip
            PokeRogueOffline-iOS-ota-manifest.json
            SHA256SUMS.txt

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # Cryptographically ties these exact files to this workflow run/commit,
      # independent of the checksums above (which only prove the download
      # wasn't corrupted, not who built it). Verifiable with
      # `gh attestation verify <file> --repo <owner>/<repo>`.
      # -----------------------------------------------------------------------
      - name: Attest build provenance
        if: ${{ steps.gate.outputs.is_release == 'true' }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'PokeRogueOffline*'

  # -----------------------------------------------------------------------
  # repo.json (the AltStore source) lives permanently on the `seed` branch
  # now — GitHub Pages (pokerogue-offline.github.io) serves from `seed`, and
  # that's the URL baked into shipped builds' AltStore source and repo.json's
  # own iconURL/website fields. `main` no longer carries a copy, so check out
  # `seed` and update its repo.json directly. appIcon.png is also re-copied
  # from `main` in case the icon changed.
  #
  # Split into its own job (rather than a tail step of `release`) so the
  # `seed-branch-write` concurrency group below only queues this short git
  # operation behind fetch-seed.yaml's own push to the same branch, instead
  # of blocking the daily seed fetch behind this job's up-to-90-minute build
  # wait.
  # -----------------------------------------------------------------------
  update-altstore:
    needs: release
    if: ${{ needs.release.outputs.is_release == 'true' && inputs.skip_altstore != true }}
    runs-on: ubuntu-latest
    concurrency:
      group: seed-branch-write
      cancel-in-progress: false
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Checkout seed branch
        uses: actions/checkout@v4
        with:
          ref: seed
          path: seed-branch

      - name: Update AltStore source on seed branch
        env:
          APP_VERSION: ${{ needs.release.outputs.version }}
          BUILD_NUMBER: ${{ needs.release.outputs.build_number }}
          IPA_SIZE: ${{ needs.release.outputs.ipa_size }}
          REPO_JSON_PATH: seed-branch/docs/repo.json
        run: node scripts/update-altstore-source.js

      - name: Commit AltStore source to seed branch
        run: |
          cp docs/appIcon.png seed-branch/docs/appIcon.png
          cd seed-branch
          git config user.name "ScooomBot"
          git config user.email "scooombot@scooom.xyz"
          git add docs/repo.json docs/appIcon.png
          git diff --staged --quiet || git commit -m "Update AltStore source for v${{ needs.release.outputs.version }}"
          git push

      - name: Notify on failure
        if: failure()
        run: |
          curl -H "Title: AltStore Source Update Failed ❌" \
               -H "Tags: warning,skull" \
               -H "Markdown: yes" \
               -H "Click: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
               -d "Failed to update the AltStore source (repo.json) on the seed branch for v${{ needs.release.outputs.version }}. The GitHub release itself already published successfully." \
               ${{ secrets.NTFY_URL }}

  # -----------------------------------------------------------------------
  # Runs only if the release job is cancelled. Finds any in-progress or
  # queued runs of the build workflows and cancels them.
  # -----------------------------------------------------------------------
  cancel-builds:
    runs-on: ubuntu-latest
    needs: release
    if: cancelled()
    steps:
      - name: Cancel any active build runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          cancel_active_runs() {
            local workflow="$1"
            local label="$2"

            RUN_IDS=$(gh api "repos/$REPO/actions/workflows/${workflow}/runs?per_page=10" \
              --jq '.workflow_runs[] | select(.status == "in_progress" or .status == "queued") | .id')

            if [ -z "$RUN_IDS" ]; then
              echo "No active $label runs to cancel."
              return
            fi

            for RUN_ID in $RUN_IDS; do
              echo "Cancelling $label run $RUN_ID..."
              gh api --method POST "repos/$REPO/actions/runs/$RUN_ID/cancel" || true
            done
          }

          cancel_active_runs "build-ios.yml" "iOS"
          cancel_active_runs "build-android.yml" "Android"
          cancel_active_runs "build-appimage.yml" "AppImage"
          cancel_active_runs "build-exe.yml" "Windows"
          cancel_active_runs "build-macos.yml" "macOS"


  notify:
    needs: release
    runs-on: ubuntu-latest
    if: ${{ always() && inputs.notify }}
    steps:
      - name: Send ntfy notification
        env:
          STATUS: ${{ needs.release.result }}
          VERSION: ${{ needs.release.outputs.version }}
          IS_RELEASE: ${{ needs.release.outputs.is_release }}
          IS_DEV_RELEASE: ${{ needs.release.outputs.is_dev_release }}
        run: |
          if [ "$STATUS" == "success" ] && [ "$IS_RELEASE" == "true" ]; then
            TITLE="Release Successful! 🚀"
            TAGS="rocket,white_check_mark"
            MSG="PokeRogueOffline v$VERSION is live."
          elif [ "$STATUS" == "success" ] && [ "$IS_DEV_RELEASE" == "true" ]; then
            TITLE="Dev Release Published 🧪"
            TAGS="test_tube,white_check_mark"
            MSG="PokeRogueOffline v$VERSION dev test release published (prerelease, dev- tag)."
          elif [ "$STATUS" == "success" ]; then
            TITLE="Build Artifacts Ready 🧪"
            TAGS="test_tube,white_check_mark"
            MSG="PokeRogueOffline v$VERSION built successfully — outputs are attached as workflow artifacts (no release published)."
          elif [ "$IS_RELEASE" == "true" ]; then
            TITLE="Release Failed! ❌"
            TAGS="warning,skull"
            MSG="The release workflow for PokeRogueOffline v$VERSION failed."
          else
            TITLE="Build Failed! ❌"
            TAGS="warning,skull"
            MSG="The build workflow for PokeRogueOffline v$VERSION failed."
          fi
          curl -H "Title: $TITLE" \
               -H "Tags: $TAGS" \
               -H "Markdown: yes" \
               -H "Click: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
               -d "$MSG" \
               ${{ secrets.NTFY_URL }}
