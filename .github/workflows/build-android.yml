name: Build PokeRogueOffline APK

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number (leave blank to use this workflow run number)'
        required: false
        type: string
      dev:
        description: 'Dev build (dev OAuth config/icon/app id, no Drive backup wiring)'
        required: false
        type: boolean
        default: false
      branch:
        description: 'PokeRogue branch to build from'
        required: false
        type: string
        default: 'main'
      version_override:
        description: 'Override the app version baked into this build (e.g. 1.12.0.0). Lets the installed app report an older version than pagefaultgames/pokerogue currently declares, for testing the update-checker against real existing releases. Leave blank to use whatever upstream currently has.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Compute native fingerprint
        id: native_fingerprint
        run: echo "fingerprint=$(node scripts/compute-native-fingerprint.js android)" >> $GITHUB_OUTPUT

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Clone PokeRogue
        run: git clone --recurse-submodules --depth 1 --branch ${{ inputs.branch || 'main' }} https://github.com/pagefaultgames/pokerogue.git pokerogue-src

      - name: Get PokeRogue version
        id: pokerogue_version
        uses: ./.github/actions/get-pokerogue-version
        with:
          version-override: ${{ inputs.version_override }}

      - name: Apply patches
        run: bash ${{ github.workspace }}/scripts/apply-patches.sh android

      - name: Inject build number into banner
        uses: ./.github/actions/inject-build-number-banner
        with:
          build-number: ${{ inputs.build_number || github.run_number }}
          dev: ${{ inputs.dev }}

      - name: Inject native fingerprint
        uses: ./.github/actions/inject-native-fingerprint
        with:
          fingerprint: ${{ steps.native_fingerprint.outputs.fingerprint }}

      - name: Inject Dropbox App Key and redirect URI
        uses: ./.github/actions/inject-dropbox-app-key
        with:
          target-file: pokerogue-src/src/system/offline/dropbox-backup.ts
          dropbox-app-key: ${{ inputs.dev && secrets.DROPBOX_APP_KEY_DEV || secrets.DROPBOX_APP_KEY }}
          redirect-uri: ${{ inputs.dev && 'xyz.scooom.pkrdev://dropbox-auth-callback' || 'xyz.scooom.pkr://dropbox-auth-callback' }}

      - name: Install PokeRogue dependencies
        working-directory: pokerogue-src
        run: pnpm install

      - name: Install Capacitor
        working-directory: pokerogue-src
        run: |
            source ${{ github.workspace }}/configs/capacitor-versions.env
            pnpm add @capacitor/core@$CAPACITOR_CORE_VERSION @capacitor/cli@$CAPACITOR_CLI_VERSION @capacitor/android@$CAPACITOR_ANDROID_VERSION @capacitor/filesystem@$CAPACITOR_FILESYSTEM_VERSION @capacitor/share@$CAPACITOR_SHARE_VERSION @capacitor/status-bar@$CAPACITOR_STATUSBAR_VERSION @capacitor/app@$CAPACITOR_APP_VERSION @capacitor/browser@$CAPACITOR_BROWSER_VERSION @capgo/capacitor-social-login@$CAPACITOR_SOCIAL_LOGIN_VERSION fflate@$CAPACITOR_FFLATE_VERSION @capacitor-community/media@$CAPACITOR_COMMUNITY_MEDIA_VERSION

      - name: Configure Capacitor
        working-directory: pokerogue-src
        run: |
          if [ "${{ inputs.dev }}" = "true" ]; then
            cp ${{ github.workspace }}/configs/android/capacitor/capacitor.config-dev.json capacitor.config.json
          else
            cp ${{ github.workspace }}/configs/android/capacitor/capacitor.config.json capacitor.config.json
          fi

      - name: Inject Scooom dev-build flag
        uses: ./.github/actions/inject-scooom-dev-flag
        with:
          dev: ${{ inputs.dev }}

      - name: Build PokeRogue
        working-directory: pokerogue-src
        env:
          VITE_BYPASS_LOGIN: '1'
        run: pnpm build --mode app

      - name: Apply post-build patches
        run: bash ${{ github.workspace }}/scripts/apply-post-build-patches.sh android

      - name: Build OTA web bundle
        working-directory: pokerogue-src
        run: zip -r ../ota-android.zip dist

      - name: Write OTA manifest
        run: |
          BUILD_NUM=${{ inputs.build_number || github.run_number }}
          VERSION="${{ steps.pokerogue_version.outputs.version }}"
          OTA_SHA=$(sha256sum ota-android.zip | cut -d' ' -f1)
          CHANNEL="stable"
          if [ "${{ inputs.dev }}" = "true" ]; then
            CHANNEL="dev"
          fi
          cat > ota-manifest-android.json <<EOF
          {
            "version": "$VERSION",
            "buildNumber": $BUILD_NUM,
            "nativeFingerprint": "${{ steps.native_fingerprint.outputs.fingerprint }}",
            "otaBundleSha256": "$OTA_SHA",
            "channel": "$CHANNEL"
          }
          EOF
          cat ota-manifest-android.json

      - name: Add Android platform
        working-directory: pokerogue-src
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: pokerogue-src
        run: npx cap sync android

      - name: Copy static MainActivity
        working-directory: pokerogue-src
        run: |
          JAVA_DIR=$(dirname "$(find android/app/src/main/java -name "MainActivity.java" | head -n 1)")
          DEST="$JAVA_DIR/MainActivity.java"
          OTA_DEST="$JAVA_DIR/OtaBridgePlugin.java"
          cp ${{ github.workspace }}/configs/android/java/MainActivity.java "$DEST"
          cp ${{ github.workspace }}/configs/android/java/OtaBridgePlugin.java "$OTA_DEST"
          if [ "${{ inputs.dev }}" = "true" ]; then
            sed -i "s/^package xyz.scooom.pkr;/package xyz.scooom.pkrdev;/" "$DEST" "$OTA_DEST"
          fi

      - name: Patch AndroidManifest to prevent keyboard resize
        working-directory: pokerogue-src
        run: node ${{ github.workspace }}/patches/android/node/android-manifest-keyboard-fix.js

      - name: Register Dropbox OAuth URL scheme
        working-directory: pokerogue-src
        run: node ${{ github.workspace }}/patches/android/node/android-manifest-url-scheme.js

      - name: Fix Android permissions
        working-directory: pokerogue-src
        run: |
          node ${{ github.workspace }}/patches/android/node/android-manifest-storage-permissions.js
          node ${{ github.workspace }}/patches/android/node/android-manifest-install-permission.js
          echo "Contents of android/app/src/main/AndroidManifest.xml"
          cat android/app/src/main/AndroidManifest.xml

      - name: Copy FileProvider path spec
        run: |
          mkdir -p pokerogue-src/android/app/src/main/res/xml
          cp ${{ github.workspace }}/configs/android/res/xml/file_paths.xml pokerogue-src/android/app/src/main/res/xml/file_paths.xml

      - name: Copy app icon
        run: |
          sudo apt-get update -q
          sudo apt-get install -y imagemagick

          if [ "${{ inputs.dev }}" = "true" ]; then
            ICON_SRC="${{ github.workspace }}/docs/appIcon-dev.png"
          else
            ICON_SRC="${{ github.workspace }}/docs/appIcon.png"
          fi
          ICON_ADAPTIVE="${{ github.workspace }}/docs/appIcon-adaptive.png"
          RES_DIR="pokerogue-src/android/app/src/main/res"

          # Legacy icons
          convert "$ICON_SRC" -resize 48x48   "$RES_DIR/mipmap-mdpi/ic_launcher.png"
          convert "$ICON_SRC" -resize 72x72   "$RES_DIR/mipmap-hdpi/ic_launcher.png"
          convert "$ICON_SRC" -resize 96x96   "$RES_DIR/mipmap-xhdpi/ic_launcher.png"
          convert "$ICON_SRC" -resize 144x144 "$RES_DIR/mipmap-xxhdpi/ic_launcher.png"
          convert "$ICON_SRC" -resize 192x192 "$RES_DIR/mipmap-xxxhdpi/ic_launcher.png"

          cp "$RES_DIR/mipmap-mdpi/ic_launcher.png"    "$RES_DIR/mipmap-mdpi/ic_launcher_round.png"
          cp "$RES_DIR/mipmap-hdpi/ic_launcher.png"    "$RES_DIR/mipmap-hdpi/ic_launcher_round.png"
          cp "$RES_DIR/mipmap-xhdpi/ic_launcher.png"   "$RES_DIR/mipmap-xhdpi/ic_launcher_round.png"
          cp "$RES_DIR/mipmap-xxhdpi/ic_launcher.png"  "$RES_DIR/mipmap-xxhdpi/ic_launcher_round.png"
          cp "$RES_DIR/mipmap-xxxhdpi/ic_launcher.png" "$RES_DIR/mipmap-xxxhdpi/ic_launcher_round.png"

          # Foreground layers for adaptive icon (1.5x size)
          convert "$ICON_ADAPTIVE" -resize 72x72   "$RES_DIR/mipmap-mdpi/ic_launcher_foreground.png"
          convert "$ICON_ADAPTIVE" -resize 108x108 "$RES_DIR/mipmap-hdpi/ic_launcher_foreground.png"
          convert "$ICON_ADAPTIVE" -resize 144x144 "$RES_DIR/mipmap-xhdpi/ic_launcher_foreground.png"
          convert "$ICON_ADAPTIVE" -resize 216x216 "$RES_DIR/mipmap-xxhdpi/ic_launcher_foreground.png"
          convert "$ICON_ADAPTIVE" -resize 288x288 "$RES_DIR/mipmap-xxxhdpi/ic_launcher_foreground.png"

          # Adaptive icon XMLs - same image for both layers for full bleed
          mkdir -p "$RES_DIR/mipmap-anydpi-v26"
          cp ${{ github.workspace }}/configs/android/res/mipmap-anydpi-v26/ic_launcher.xml "$RES_DIR/mipmap-anydpi-v26/ic_launcher.xml"
          cp ${{ github.workspace }}/configs/android/res/mipmap-anydpi-v26/ic_launcher_round.xml "$RES_DIR/mipmap-anydpi-v26/ic_launcher_round.xml"

      - name: Set version in build.gradle
        working-directory: pokerogue-src/android/app
        run: |
          BUILD_NUM=${{ inputs.build_number || github.run_number }}
          VERSION="${{ steps.pokerogue_version.outputs.version }}"

          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          HOTFIX=$(echo "$VERSION" | cut -d. -f4)

          VERSION_CODE=$(( MINOR * 100000000 + PATCH * 1000000 + HOTFIX * 10000 + BUILD_NUM ))
          VERSION_NAME="${VERSION}.${BUILD_NUM}"

          sed -i "s/versionCode .*/versionCode $VERSION_CODE/" build.gradle
          sed -i "s/versionName .*/versionName \"$VERSION_NAME\"/" build.gradle

      - name: Make gradlew executable
        working-directory: pokerogue-src/android
        run: chmod +x gradlew

      - name: Restore pinned debug keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}" | base64 -d > ~/.android/debug.keystore

      - name: Build release APK
        working-directory: pokerogue-src/android
        run: |
          ./gradlew assembleDebug \
            -Pandroid.injected.signing.store.file=$HOME/.android/debug.keystore \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android

      - name: Rename resulting APK
        run: |
          UNSIGNED="pokerogue-src/android/app/build/outputs/apk/debug/app-debug.apk"
          if [ "${{ inputs.dev }}" = "true" ]; then
            OUTPUT="PokeRogueOffline-dev.apk"
          else
            OUTPUT="PokeRogueOffline.apk"
          fi
          cp -v $UNSIGNED $OUTPUT
          echo "APK_NAME=$OUTPUT" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokeRogueOffline-Android${{ inputs.dev && '-dev' || '' }}
          path: |
            ${{ env.APK_NAME }}
            ota-android.zip
            ota-manifest-android.json
          retention-days: 30
