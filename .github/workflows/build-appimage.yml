name: Build PokeRogueOffline AppImage

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number (leave blank to use this workflow run number)'
        required: false
        type: string
      dev:
        description: 'Dev build (banner marker + -dev naming)'
        required: false
        type: boolean
        default: false
      branch:
        description: 'PokeRogue branch to build from'
        required: false
        type: string
        default: 'main'
      version_override:
        description: 'Override the app version baked into this build (e.g. 1.12.0.0). Lets the installed app report an older version than pagefaultgames/pokerogue currently declares, for testing the update-checker against real existing releases. Leave blank to use whatever upstream currently has.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Clone PokeRogue fork
        run: git clone --recurse-submodules --depth 1 --branch ${{ inputs.branch || 'main' }} https://github.com/pagefaultgames/pokerogue.git pokerogue-src

      - name: Get PokeRogue version
        id: pokerogue_version
        uses: ./.github/actions/get-pokerogue-version
        with:
          version-override: ${{ inputs.version_override }}

      - name: Apply patches
        run: bash ${{ github.workspace }}/scripts/apply-patches.sh appimage

      - name: Inject build number into banner
        uses: ./.github/actions/inject-build-number-banner
        with:
          build-number: ${{ inputs.build_number || github.run_number }}
          dev: ${{ inputs.dev }}

      - name: Install PokeRogue dependencies
        working-directory: pokerogue-src
        run: pnpm install

      - name: Install Electron dependencies
        working-directory: pokerogue-src
        run: pnpm add -D electron@43.0.0 electron-builder@26.15.3

      - name: Install Capacitor plugin stub for shared code resolution
        working-directory: pokerogue-src
        # google-drive-backup.ts and dropbox-backup.ts each dynamically import
        # native-only Capacitor plugins (@capgo/capacitor-social-login,
        # @capacitor/browser, @capacitor/app), gated behind an isCapacitor()
        # runtime check that's always false on Electron — but Vite/Rolldown
        # still needs each package resolvable at BUILD time to code-split it,
        # even though the chunk never actually loads here. Without this, the
        # build (and Vitest's own module resolution, below) fails with an
        # unresolved-import error even on a platform that will never execute
        # that branch.
        run: pnpm add @capacitor/core@8.4.1 @capacitor/app@8.1.1 @capacitor/browser@8.0.4 @capgo/capacitor-social-login@8.3.33

      - name: Run unit test suite
        working-directory: pokerogue-src
        run: pnpm test:silent

      - name: Inject Scooom dev-build flag
        uses: ./.github/actions/inject-scooom-dev-flag
        with:
          dev: ${{ inputs.dev }}

      - name: Build PokeRogue
        working-directory: pokerogue-src
        env:
          VITE_BYPASS_LOGIN: '1'
        run: pnpm build --mode app

      - name: Apply post-build patches
        run: bash ${{ github.workspace }}/scripts/apply-post-build-patches.sh appimage

      - name: Copy Electron config files into place
        run: |
          cp ${{ github.workspace }}/configs/desktop/electron/main.cjs pokerogue-src/main.cjs
          cp ${{ github.workspace }}/configs/desktop/electron/preload.cjs pokerogue-src/preload.cjs
          cp ${{ github.workspace }}/configs/desktop/electron/electron-builder.appimage.json pokerogue-src/electron-builder.json
          cp ${{ github.workspace }}/docs/appIcon.png pokerogue-src/appIcon.png

      - name: Inject Google OAuth credentials into main.cjs
        uses: ./.github/actions/inject-google-desktop-oauth
        with:
          client-id: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          client-secret: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}

      - name: Inject Dropbox App Key
        uses: ./.github/actions/inject-dropbox-app-key
        with:
          target-file: pokerogue-src/main.cjs
          dropbox-app-key: ${{ inputs.dev == 'true' && secrets.DROPBOX_APP_KEY_DEV || secrets.DROPBOX_APP_KEY }}

      - name: Set electron main in package.json
        uses: ./.github/actions/set-electron-package-metadata

      - name: Get 3 Num Version
        id: old_ver
        uses: ./.github/actions/get-electron-package-version

      - name: Generate AppImage
        working-directory: pokerogue-src
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm electron-builder --linux AppImage --publish never --config electron-builder.json --config.extraMetadata.version=${{ steps.old_ver.outputs.version }}

      - name: Rename and save AppImage
        id: appimage_path
        run: |
          FILE=$(find -type f -name "*.AppImage")
          if [ "${{ inputs.dev }}" = "true" ]; then
            OUTPUT="./PokeRogueOffline-dev.AppImage"
          else
            OUTPUT="./PokeRogueOffline.AppImage"
          fi
          mv "$FILE" "$OUTPUT"
          echo "AppImage=$OUTPUT" >> $GITHUB_OUTPUT

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokeRogueOffline-AppImage${{ inputs.dev && '-dev' || '' }}
          path: ${{ steps.appimage_path.outputs.AppImage }}
          retention-days: 30
