name: Build PokeRogueOffline AppImage

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number (leave blank to use this workflow run number)'
        required: false
        type: string
      dev:
        description: 'Dev build (banner marker + -dev naming)'
        required: false
        type: boolean
        default: false
      branch:
        description: 'PokeRogue branch to build from'
        required: false
        type: string
        default: 'main'
      version_override:
        description: 'Override the app version baked into this build (e.g. 1.12.0.0). Lets the installed app report an older version than pagefaultgames/pokerogue currently declares, for testing the update-checker against real existing releases. Leave blank to use whatever upstream currently has.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm

      # Same idea as the mobile builds' native fingerprint: a hash over
      # everything that makes up the Electron shell. A release whose
      # fingerprint matches an installed shell can be delivered to it as a
      # content-only update; any other release replaces the whole app.
      - name: Compute desktop shell fingerprint
        id: desktop_fingerprint
        shell: bash
        run: echo "fingerprint=$(node scripts/compute-native-fingerprint.js desktop)" >> $GITHUB_OUTPUT

      - name: Clone PokeRogue fork
        run: git clone --recurse-submodules --depth 1 --branch ${{ inputs.branch || 'main' }} https://github.com/pagefaultgames/pokerogue.git pokerogue-src

      - name: Get PokeRogue version
        id: pokerogue_version
        uses: ./.github/actions/get-pokerogue-version
        with:
          version-override: ${{ inputs.version_override }}

      - name: Apply patches
        run: bash ${{ github.workspace }}/scripts/apply-patches.sh appimage

      - name: Inject build number into banner
        uses: ./.github/actions/inject-build-number-banner
        with:
          build-number: ${{ inputs.build_number || github.run_number }}
          dev: ${{ inputs.dev }}

      - name: Install PokeRogue dependencies
        working-directory: pokerogue-src
        run: pnpm install

      - name: Install Electron dependencies
        working-directory: pokerogue-src
        shell: bash
        # Versions come from configs/desktop/versions.env, which is part of
        # the desktop shell fingerprint.
        run: |
          source "${{ github.workspace }}/configs/desktop/versions.env"
          pnpm add -D electron@$ELECTRON_VERSION electron-builder@$ELECTRON_BUILDER_VERSION

      - name: Install shell runtime dependencies
        working-directory: pokerogue-src
        shell: bash
        # Not devDependencies - discord-rpc.cjs and ota-desktop.cjs require()
        # these at runtime in the packaged app, so they need to actually ship
        # in node_modules.
        run: |
          source "${{ github.workspace }}/configs/desktop/versions.env"
          pnpm add @xhayper/discord-rpc@$DISCORD_RPC_VERSION yauzl@$YAUZL_VERSION

      - name: Install Capacitor plugin stub for shared code resolution
        working-directory: pokerogue-src
        # google-drive-backup.ts dynamically imports @capgo/capacitor-social-login,
        # gated behind an isCapacitor() runtime check that's always false on
        # Electron — but Vite/Rolldown still needs the package resolvable at
        # BUILD time to code-split it, even though the chunk never actually
        # loads here. Without this, the build fails with an unresolved-import
        # error even on a platform that will never execute that branch.
        run: pnpm add @capacitor/core@8.4.1 @capgo/capacitor-social-login@8.3.33

      - name: Inject Scooom dev-build flag
        uses: ./.github/actions/inject-scooom-dev-flag
        with:
          dev: ${{ inputs.dev }}

      - name: Build PokeRogue
        working-directory: pokerogue-src
        env:
          VITE_BYPASS_LOGIN: '1'
        run: pnpm build --mode app

      - name: Apply post-build patches
        run: bash ${{ github.workspace }}/scripts/apply-post-build-patches.sh appimage

      # dist/ is the same content on Windows, Linux and macOS, so the
      # desktop OTA channel zips and manifest are produced once, here, and
      # serve all three (see scripts/split-ota-bundle.js's desktop mode).
      # Must run on the finished dist/ - after the post-build patches.
      - name: Split desktop OTA bundle into code/assets/locales channels
        run: |
          BUILD_NUM=${{ inputs.build_number || github.run_number }}
          VERSION="${{ steps.pokerogue_version.outputs.version }}"
          CHANNEL="stable"
          if [ "${{ inputs.dev }}" = "true" ]; then
            CHANNEL="dev"
          fi
          node ${{ github.workspace }}/scripts/split-ota-bundle.js desktop \
            pokerogue-src/dist \
            . \
            "$VERSION" \
            "$BUILD_NUM" \
            "${{ steps.desktop_fingerprint.outputs.fingerprint }}" \
            "$CHANNEL"

      - name: Copy Electron config files into place
        run: |
          cp ${{ github.workspace }}/configs/desktop/electron/main.cjs pokerogue-src/main.cjs
          cp ${{ github.workspace }}/configs/desktop/electron/preload.cjs pokerogue-src/preload.cjs
          cp ${{ github.workspace }}/configs/desktop/electron/updater.cjs pokerogue-src/updater.cjs
          cp ${{ github.workspace }}/configs/desktop/electron/update-io.cjs pokerogue-src/update-io.cjs
          cp ${{ github.workspace }}/configs/desktop/electron/discord-rpc.cjs pokerogue-src/discord-rpc.cjs
          cp ${{ github.workspace }}/configs/desktop/electron/electron-builder.appimage.json pokerogue-src/electron-builder.json
          cp ${{ github.workspace }}/docs/appIcon.png pokerogue-src/appIcon.png

      - name: Stage content-updater shell files
        uses: ./.github/actions/stage-desktop-ota
        with:
          fingerprint: ${{ steps.desktop_fingerprint.outputs.fingerprint }}

      - name: Inject build number into updater.cjs
        uses: ./.github/actions/inject-build-number-banner
        with:
          build-number: ${{ inputs.build_number || github.run_number }}
          dev: ${{ inputs.dev }}
          target-file: pokerogue-src/updater.cjs

      - name: Inject real app version into updater.cjs
        uses: ./.github/actions/inject-app-version

      - name: Inject Discord client ID into discord-rpc.cjs
        uses: ./.github/actions/inject-discord-client-id
        with:
          target-file: pokerogue-src/discord-rpc.cjs
          discord-client-id: ${{ vars.DISCORD_CLIENT_ID }}

      - name: Inject Google OAuth credentials into main.cjs
        uses: ./.github/actions/inject-google-desktop-oauth
        with:
          client-id: ${{ vars.GOOGLE_DESKTOP_CLIENT_ID }}
          client-secret: ${{ vars.GOOGLE_DESKTOP_CLIENT_SECRET }}

      - name: Inject Dropbox App Key
        uses: ./.github/actions/inject-dropbox-app-key
        with:
          target-file: pokerogue-src/main.cjs
          dropbox-app-key: ${{ inputs.dev && vars.DROPBOX_APP_KEY_DEV || vars.DROPBOX_APP_KEY }}

      - name: Set electron main in package.json
        uses: ./.github/actions/set-electron-package-metadata

      - name: Get 3 Num Version
        id: old_ver
        uses: ./.github/actions/get-electron-package-version

      - name: Generate AppImage
        working-directory: pokerogue-src
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm electron-builder --linux AppImage --publish never --config electron-builder.json --config.extraMetadata.version=${{ steps.old_ver.outputs.version }}

      - name: Rename and save AppImage
        id: appimage_path
        run: |
          FILE=$(find -type f -name "*.AppImage")
          if [ "${{ inputs.dev }}" = "true" ]; then
            OUTPUT="./PokeRogueOffline-dev.AppImage"
          else
            OUTPUT="./PokeRogueOffline.AppImage"
          fi
          mv "$FILE" "$OUTPUT"
          echo "AppImage=$OUTPUT" >> $GITHUB_OUTPUT

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokeRogueOffline-AppImage${{ inputs.dev && '-dev' || '' }}
          path: |
            ${{ steps.appimage_path.outputs.AppImage }}
            ota-desktop-code.zip
            ota-desktop-assets.zip
            ota-desktop-locales.zip
            ota-desktop-manifest.json
          retention-days: 30
