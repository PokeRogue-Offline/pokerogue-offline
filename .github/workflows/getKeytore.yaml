name: recover-keystore
on: workflow_dispatch
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Decode keystore
        env:
          KS: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: echo "$KS" | base64 -d > release.txt
      - uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: release.txt
          retention-days: 1
