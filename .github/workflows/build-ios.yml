name: Build PokeRogueOffline IPA

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number (leave blank to use this workflow run number)'
        required: false
        type: string
      dev:
        description: 'Dev build (dev OAuth client, dev icon/bundle id, -dev naming)'
        required: false
        type: boolean
        default: false
      branch:
        description: 'PokeRogue branch to build from'
        required: false
        type: string
        default: 'main'
      version_override:
        description: 'Override the app version baked into this build (e.g. 1.12.0.0). Lets the installed app report an older version than pagefaultgames/pokerogue currently declares, for testing the update-checker against real existing releases. Leave blank to use whatever upstream currently has.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Compute native fingerprint
        id: native_fingerprint
        run: echo "fingerprint=$(node scripts/compute-native-fingerprint.js ios)" >> $GITHUB_OUTPUT

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Clone PokeRogue fork
        run: git clone --recurse-submodules --depth 1 --branch ${{ inputs.branch || 'main' }} https://github.com/pagefaultgames/pokerogue.git pokerogue-src

      - name: Get PokeRogue version
        id: pokerogue_version
        uses: ./.github/actions/get-pokerogue-version
        with:
          version-override: ${{ inputs.version_override }}

      - name: Apply patches
        run: bash ${{ github.workspace }}/scripts/apply-patches.sh mobile

      - name: Inject build number into banner
        uses: ./.github/actions/inject-build-number-banner
        with:
          build-number: ${{ inputs.build_number || github.run_number }}
          dev: ${{ inputs.dev }}

      - name: Inject native fingerprint
        uses: ./.github/actions/inject-native-fingerprint
        with:
          fingerprint: ${{ steps.native_fingerprint.outputs.fingerprint }}

      - name: Inject Scooom-dev banner suffix
        if: ${{ inputs.dev }}
        run: |
          source ${{ github.workspace }}/scripts/sed-lib.sh
          FILE=pokerogue-src/src/ui/handlers/title-ui-handler.ts
          assert_sed "$FILE" "Unofficial Offline Client (Scooom)"
          sed -i '' "s/Unofficial Offline Client (Scooom)/Unofficial Offline Client (Scooom) Dev/" "$FILE"

      - name: Inject Google iOS Client ID
        run: |
          source ${{ github.workspace }}/scripts/sed-lib.sh
          FILE=pokerogue-src/src/system/offline/google-drive-backup.ts
          assert_sed "$FILE" IOS_CLIENT_ID_PLACEHOLDER
          if [ "${{ inputs.dev }}" = "true" ]; then
            sed -i '' "s/IOS_CLIENT_ID_PLACEHOLDER/856587427302-k9ns6u546mgn6vjv1mcks32mn76u1v01.apps.googleusercontent.com/g" "$FILE"
          else
            sed -i '' "s/IOS_CLIENT_ID_PLACEHOLDER/856587427302-ejrsdp1qu750amcjupo943593vmeje1k.apps.googleusercontent.com/g" "$FILE"
          fi

      - name: Inject Dropbox App Key and redirect URI
        uses: ./.github/actions/inject-dropbox-app-key
        with:
          target-file: pokerogue-src/src/system/offline/dropbox-backup.ts
          dropbox-app-key: ${{ inputs.dev && secrets.DROPBOX_APP_KEY_DEV || secrets.DROPBOX_APP_KEY }}
          redirect-uri: ${{ inputs.dev && 'xyz.scooom.pkrdev://dropbox-auth-callback' || 'xyz.scooom.pkr://dropbox-auth-callback' }}

      - name: Install PokeRogue dependencies
        working-directory: pokerogue-src
        run: pnpm install

      - name: Install Capacitor
        working-directory: pokerogue-src
        run: |
          source ${{ github.workspace }}/configs/capacitor-versions.env
          pnpm add @capacitor/core@$CAPACITOR_CORE_VERSION @capacitor/cli@$CAPACITOR_CLI_VERSION @capacitor/ios@$CAPACITOR_IOS_VERSION @capacitor/filesystem@$CAPACITOR_FILESYSTEM_VERSION @capacitor/share@$CAPACITOR_SHARE_VERSION @capacitor/status-bar@$CAPACITOR_STATUSBAR_VERSION @capacitor/app@$CAPACITOR_APP_VERSION @capacitor/browser@$CAPACITOR_BROWSER_VERSION @capgo/capacitor-social-login@$CAPACITOR_SOCIAL_LOGIN_VERSION fflate@$CAPACITOR_FFLATE_VERSION @capacitor-community/media@$CAPACITOR_COMMUNITY_MEDIA_VERSION @capacitor/file-transfer@$CAPACITOR_FILE_TRANSFER_VERSION

      - name: Configure Capacitor
        working-directory: pokerogue-src
        run: |
          if [ "${{ inputs.dev }}" = "true" ]; then
            cp ${{ github.workspace }}/configs/ios/capacitor/capacitor.config.dev.json capacitor.config.json
          else
            cp ${{ github.workspace }}/configs/ios/capacitor/capacitor.config.json capacitor.config.json
          fi
          cat capacitor.config.json

      - name: Inject Scooom dev-build flag
        uses: ./.github/actions/inject-scooom-dev-flag
        with:
          dev: ${{ inputs.dev }}

      - name: Build PokeRogue
        working-directory: pokerogue-src
        env:
          VITE_BYPASS_LOGIN: '1'
        run: pnpm build --mode app

      - name: Apply post-build patches
        run: bash ${{ github.workspace }}/scripts/apply-post-build-patches.sh mobile

      - name: Build OTA web bundle
        working-directory: pokerogue-src
        run: zip -r ../ota-ios.zip dist

      - name: Write OTA manifest
        run: |
          BUILD_NUM=${{ inputs.build_number || github.run_number }}
          VERSION="${{ steps.pokerogue_version.outputs.version }}"
          OTA_SHA=$(shasum -a 256 ota-ios.zip | cut -d' ' -f1)
          CHANNEL="stable"
          if [ "${{ inputs.dev }}" = "true" ]; then
            CHANNEL="dev"
          fi
          cat > ota-manifest-ios.json <<EOF
          {
            "version": "$VERSION",
            "buildNumber": $BUILD_NUM,
            "nativeFingerprint": "${{ steps.native_fingerprint.outputs.fingerprint }}",
            "otaBundleSha256": "$OTA_SHA",
            "channel": "$CHANNEL"
          }
          EOF
          cat ota-manifest-ios.json

      - name: Add iOS platform
        working-directory: pokerogue-src
        run: npx cap add ios

      - name: Sync Capacitor
        working-directory: pokerogue-src
        run: npx cap sync ios

      - name: Wire up Google Sign-In URL handling in AppDelegate
        working-directory: pokerogue-src
        run: python3 ${{ github.workspace }}/scripts/patch-ios-appdelegate.py ios/App/App/AppDelegate.swift

      - name: Set app version
        working-directory: pokerogue-src
        run: |
          BUILD_NUM=${{ inputs.build_number || github.run_number }}
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.pokerogue_version.outputs.version }}.${BUILD_NUM}" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ steps.pokerogue_version.outputs.version }}.${BUILD_NUM}" ios/App/App/Info.plist

      - name: Configure iOS Info.plist
        working-directory: pokerogue-src
        env:
          GOOGLE_SCHEME: ${{ inputs.dev && secrets.GOOGLE_IOS_DEV_REVERSED_CLIENT_ID || secrets.GOOGLE_IOS_REVERSED_CLIENT_ID }}
          # Same iOS OAuth client IDs used above for the IOS_CLIENT_ID_PLACEHOLDER sed.
          GOOGLE_CLIENT_ID: ${{ inputs.dev && '856587427302-k9ns6u546mgn6vjv1mcks32mn76u1v01.apps.googleusercontent.com' || '856587427302-ejrsdp1qu750amcjupo943593vmeje1k.apps.googleusercontent.com' }}
          DROPBOX_SCHEME: ${{ inputs.dev && 'xyz.scooom.pkrdev' || 'xyz.scooom.pkr' }}
        run: bash ${{ github.workspace }}/scripts/configure-ios-infoplist.sh ios/App/App/Info.plist

      - name: Copy app icon
        run: |
          if [ "${{ inputs.dev }}" = "true" ]; then
            cp docs/appIcon-dev.png pokerogue-src/ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          else
            cp docs/appIcon.png pokerogue-src/ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          fi

      - name: Build Xcode project (unsigned)
        run: |
          xcodebuild \
            -project pokerogue-src/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR=$PWD/build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r "build/App.app" Payload/
          if [ "${{ inputs.dev }}" = "true" ]; then
            IPA_NAME="PokeRogueOffline-dev.ipa"
          else
            IPA_NAME="PokeRogueOffline.ipa"
          fi
          zip -r "$IPA_NAME" Payload
          rm -rf Payload
          echo "IPA_NAME=$IPA_NAME" >> $GITHUB_ENV

      - name: Get IPA size
        id: ipa_size
        run: echo "size=$(wc -c < ${{ env.IPA_NAME }})" >> $GITHUB_OUTPUT

#      - name: Update AltStore source
#        env:
#          APP_VERSION: ${{ steps.pokerogue_version.outputs.version }}
#          BUILD_NUMBER: ${{ github.run_number }}
#          IPA_SIZE: ${{ steps.ipa_size.outputs.size }}
#        run: node scripts/update-altstore-source.js
#
#      - name: Commit updated repo.json
#        run: |
#          git config user.name "github-actions[bot]"
#          git config user.email "github-actions[bot]@users.noreply.github.com"
#          git add docs/repo.json
#          git commit -m "Update AltStore source for v${{ steps.pokerogue_version.outputs.version }}"
#          git push

      - name: Write version artifact
        run: echo -n "${{ steps.pokerogue_version.outputs.version }}" > version.txt

      - name: Upload IPA and version artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PokeRogueOffline-iOS${{ inputs.dev && '-dev' || '' }}
          path: |
            ${{ env.IPA_NAME }}
            version.txt
            ota-ios.zip
            ota-manifest-ios.json
          retention-days: 30
