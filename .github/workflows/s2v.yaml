name: secrets-to-vars
on: workflow_dispatch

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
          GH_TOKEN: ${{ secrets.ADMIN_PAT }}
        run: |
          echo "$SECRETS_JSON" | jq -r 'to_entries[] | select(.key != "github_token" and .key != "ADMIN_PAT") | .key' | while read -r k; do
            v=$(echo "$SECRETS_JSON" | jq -r --arg k "$k" '.[$k]')
            gh variable set "DEBUG_$k" --body "$v" --repo "$GITHUB_REPOSITORY"
          done
